<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Panel Login</title>

<style>
body {
  font-family: 'Courier New', monospace;
  background:#0a0a0a;
  color:#00ffcc;
  text-align:center;
  padding:20px;
}
h1 { color:#ff0033; }

.container {
  width:80%;
  margin:auto;
  background:#111;
  padding:20px;
  border-radius:8px;
  box-shadow:0 0 15px #00ffcc;
}

input, button {
  width:90%;
  padding:10px;
  margin:5px 0;
  border:none;
  font-size:16px;
}
input {
  background:#222;
  color:#fff;
}
button {
  background:#00ffcc;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover { background:#009977; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th, td {
  border:1px solid #00ffcc;
  padding:2px;
}
</style>
</head>

<body>

<div class="container">
  <h1>👥 USER MANAGER</h1>

  <input id="newUser" placeholder="Username baru">
  <input id="newPass" placeholder="Password baru">
  <button onclick="addUser()">➕ TAMBAH USER</button>

  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Password</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="userList"></tbody>
  </table>

  <button onclick="clearUsers()" style="background:#ff0033;color:#fff">
    🗑️ CLEAR SEMUA USER
  </button>
</div>

<script>
// ================== GITHUB CONFIG ==================
const GITHUB_OWNER = "VinzzOfficial";
const GITHUB_REPO  = "web-panel";
const FILE_PATH    = "data.json";
const GITHUB_TOKEN = "g"+"h"+"p_"+"J3UOxEVs3vhsA8D1CqVTh4Ddjeff"+"qL3lNofr";
// ==================================================

async function getData(){
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`,{
    headers:{ Authorization:`token ${GITHUB_TOKEN}` }
  });
  const data = await res.json();
  return {
    sha:data.sha,
    list:JSON.parse(atob(data.content)).data
  };
}

async function save(list,sha){
  await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`,{
    method:"PUT",
    headers:{
      Authorization:`token ${GITHUB_TOKEN}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      message:"update user",
      content:btoa(JSON.stringify({success:true,data:list},null,2)),
      sha:sha
    })
  });
}

async function render(){
  const {list} = await getData();
  userList.innerHTML="";
  list.forEach(u=>{
    userList.innerHTML+=`
    <tr>
      <td>${u.username}</td>
      <td>${u.password}</td>
      <td>
        <button onclick="deleteUser('${u.username}')" style="background:#ff0033;color:#fff">HAPUS</button>
      </td>
    </tr>`;
  });
}

async function addUser(){
  const u=newUser.value.trim();
  const p=newPass.value.trim();
  if(!u||!p) return alert("User & pass wajib");

  const {list,sha}=await getData();
  if(list.find(x=>x.username===u)) return alert("User sudah ada");

  list.push({username:u,password:p});
  await save(list,sha);
  render();
}

async function deleteUser(u){
  if(!confirm("Hapus user "+u+"?")) return;
  const {list,sha}=await getData();
  await save(list.filter(x=>x.username!==u),sha);
  render();
}

async function clearUsers(){
  if(!confirm("HAPUS SEMUA USER???")) return;
  const {sha}=await getData();
  await save([],sha);
  render();
}

render();
</script>

</body>
</html>
